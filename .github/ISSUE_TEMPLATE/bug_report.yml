name: Bug Report
description: Report a problem with Hyper Battery Monitor
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Hyper Battery Monitor.

        Before submitting a bug report, please make sure you are using the latest available version.

  - type: input
    id: version
    attributes:
      label: Application version
      description: Which version of Hyper Battery Monitor are you using?
      placeholder: "v2.3.1"
    validations:
      required: true

  - type: input
    id: windows-version
    attributes:
      label: Windows version
      description: Which version of Windows are you using?
      placeholder: "Windows 11 25H2"
    validations:
      required: true

  - type: input
    id: headset
    attributes:
      label: Headset
      description: Which HyperX headset are you using?
      placeholder: "HyperX Cloud III Wireless"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: Clearly describe what went wrong.
      placeholder: "Describe the problem..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps needed to reproduce the problem.
      placeholder: |
        1. Start Hyper Battery Monitor
        2. Open Settings
        3. Change...
        4. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect the application to do?
      placeholder: "The application should..."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
      placeholder: "The application..."
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional information
      description: Add screenshots, logs, or any other information that may help.
      placeholder: "Additional details..."
    validations:
      required: false